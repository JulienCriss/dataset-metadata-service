[project]
name = "dataset-metadata-service"
version = "0.1.0"
description = "REST API for managing datasets and the data elements they contain."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.16,<6.0",
    "djangorestframework>=3.17,<4",
    "django-filter>=26.1,<27",
    "drf-spectacular>=0.30,<0.31",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-django>=4.12",
    "pytest-cov>=7.1",
    "ruff>=0.16",
]

[tool.uv]

package = false

[tool.ruff]
# target-version is inferred from project.requires-python.
line-length = 90
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["config", "metadata_catalog"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["metadata_catalog/tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["metadata_catalog"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
